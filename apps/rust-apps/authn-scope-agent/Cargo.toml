version = "0.1.0"
edition = "2021"

[[bin]]
name = "authn-scope-agent"
path = "src/main.rs"

[dependencies]
authn-scope-proto = { workspace = true }
authn-scope-tpm   = { workspace = true }
tokio            = { workspace = true }
tokio-stream     = "0.1"
