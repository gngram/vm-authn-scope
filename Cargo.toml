[workspace]
members = [
    "libs/rust-libs/authn-scope-proto",
    "libs/rust-libs/authn-scope-ca",
    "libs/rust-libs/authn-scope-tpm",
    "apps/rust-apps/authn-scope-server",
    "apps/rust-apps/authn-scope-agent",
    "testapp/check-svid-rust",
    "testapp/grpc-app-rust",
    "testapp/workload-test-workload",
    "testapp/profiler",
]
resolver = "2"

[workspace.dependencies]
spiffe       = { version = "0.16", features = ["workload-api", "x509-source"] }
# Async runtime
tokio        = { version = "1",    features = ["full"] }
tokio-vsock  = { version = "0.5",  features = [] }
rustls-pemfile = "2"

# gRPC & Protobuf
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
prost = "0.13"
tonic-build = "0.12"

# X.509 / CSR — pure Rust, uses ring internally
# x509-parser is needed for from_ca_cert_pem and CertificateSigningRequestParams::from_pem
rcgen = { version = "0.13", features = ["pem", "x509-parser", "ring"] }

# Pure-Rust crypto primitives (ring is used by rcgen + rustls)
ring = "0.17"

# Serialisation
serde      = { version = "1", features = ["derive"] }
serde_json       = "1.0"
x509-parser      = "0.16"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging / tracing
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1.0"
anyhow    = "1"

# Base64url for JWT encoding
base64 = "0.22"

# Time operations for cert validity/rotation
time = "0.3"

# TPM 2.0 support (agent-side: TPM operations; server-side: verification)
tss-esapi = "7.7"

# Workspace-internal crates
authn-scope-proto = { path = "libs/rust-libs/authn-scope-proto" }
authn-scope-ca    = { path = "libs/rust-libs/authn-scope-ca" }
authn-scope-tpm   = { path = "libs/rust-libs/authn-scope-tpm" }
